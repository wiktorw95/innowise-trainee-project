name: Innogram CI

on:
  push:
    branches: [ "main", "dev", "feature/**" ]
  pull_request:
    branches: [ "main", "dev", "feature/**" ]
  workflow_dispatch:

env:
  DATABASE_URL: "postgresql://innogram_user:innogram_password@localhost:5432/innogram"
  REDIS_HOST: "localhost"
  REDIS_PORT: 6379
  JWT_SECRET: "ci-dummy-jwt-secret-key-1234567890"
  JWT_REFRESH_SECRET: "ci-dummy-refresh-secret-key-1234567890"
  GOOGLE_CLIENT_ID: "ci-dummy-google-client-id"
  GOOGLE_CLIENT_SECRET: "ci-dummy-google-client-secret"
  FRONTEND_URL: "http://localhost:5173"
  NODE_ENV: "test"

jobs:
  quality-gate:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: packages/shared
        run: npx prisma generate

      - name: Lint and Type-check
        run: npx turbo run lint type-check

  build-and-test:
    name: Build & Test
    needs: quality-gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: innogram_user
          POSTGRES_PASSWORD: innogram_password
          POSTGRES_DB: innogram
        ports: [ 5432:5432 ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: [ 6379:6379 ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create .env for testing
        run: |
          echo "DATABASE_URL=${DATABASE_URL}" >> .env
          echo "REDIS_HOST=${REDIS_HOST}" >> .env
          echo "REDIS_PORT=${REDIS_PORT}" >> .env
          echo "JWT_SECRET=${JWT_SECRET}" >> .env
          echo "JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}" >> .env
          echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" >> .env

      - name: Sync Database Schema
        working-directory: packages/shared
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: Build Projects
        run: npx turbo run build

      - name: Run Tests
        run: npx turbo run test