name: Innogram CI

on:
  push:
    branches: ["main", "dev", "feature/**"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: innogram_user
          POSTGRES_PASSWORD: innogram_password
          POSTGRES_DB: innogram
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/core_microservice/prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://innogram_user:innogram_password@localhost:5432/innogram"

      - name: Setup Database Schemas
        env:
          PGPASSWORD: innogram_password
        run: |
          psql -h localhost -U innogram_user -d innogram -c "CREATE SCHEMA IF NOT EXISTS auth;"
          psql -h localhost -U innogram_user -d innogram -c "CREATE SCHEMA IF NOT EXISTS main;"
          psql -h localhost -U innogram_user -d innogram -c "CREATE SCHEMA IF NOT EXISTS notification;"

      - name: Push Database Schema
        working-directory: apps/core_microservice
        run: npx prisma db push
        env:
          DATABASE_URL: "postgresql://innogram_user:innogram_password@localhost:5432/innogram"

      - name: Run Seed Script
        working-directory: apps/core_microservice
        run: npx prisma db seed
        env:
          DATABASE_URL: "postgresql://innogram_user:innogram_password@localhost:5432/innogram"