version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: innogram-postgres
    environment:
      POSTGRES_DB: innogram
      POSTGRES_USER: innogram_user
      POSTGRES_PASSWORD: innogram_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - innogram-network

  redis:
    image: redis:7-alpine
    container_name: innogram-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - innogram-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: innogram-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: innogram
      RABBITMQ_DEFAULT_PASS: innogram_password
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - innogram-network
  core-service:
    container_name: innogram-core
    build:
      context: .
      dockerfile: apps/core_microservice/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://innogram_user:innogram_password@postgres:5432/innogram
      - REDIS_HOST=redis
      - RABBITMQ_URL=amqp://innogram:innogram_password@rabbitmq:5672
      - AUTH_SERVICE_URL=http://auth-service:3002
      - CLIENT_URL=http://localhost:3001
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - innogram-network

  auth-service:
    container_name: innogram-auth
    build:
      context: .
      dockerfile: apps/auth_microservice/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=postgresql://innogram_user:innogram_password@postgres:5432/innogram
      - REDIS_HOST=redis
      - FRONTEND_URL=http://localhost:3001
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-me}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
    depends_on:
      - postgres
      - redis
    networks:
      - innogram-network

  client-app:
    container_name: innogram-client
    build:
      context: .
      dockerfile: apps/client_app/Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - core-service
      - auth-service
    networks:
      - innogram-network

volumes:
  postgres_data:
  redis_data:

networks:
  innogram-network:
    driver: bridge
